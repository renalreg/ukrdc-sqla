name: Test and Publish

on:
  push:
  pull_request:
    branches:
      # Branches from forks have the form 'user:branch-name' so we only run
      # this job on pull_request events for branches that look like fork
      # branches. Without this we would end up running this job twice for non
      # forked PRs, once for the push and then once for opening the PR.
      - "**:**"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    name: Python Test workflow
    uses: renalreg/.github/.github/workflows/python_test.yml@main
    secrets: inherit
    with:
      python_versions: '["3.10","3.11","3.12"]'
      package_manager_command: "pip install poetry"
      install_command: "poetry install --no-interaction --all-groups"
      test_command: "poetry run tox"
      org_deps: true

  publish:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'release'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install and configure Poetry
        run: python -m pip install poetry

      - name: Set Poetry config
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.POETRY_PYPI_TOKEN_PYPI }}
        run: |
          poetry config pypi-token.pypi "$POETRY_PYPI_TOKEN_PYPI

      - name: Build with Poetry
        run: poetry build

      - name: Publish with Poetry
        run: poetry publish
