name: Migrations Check

# For each declarative Base in ukrdc_sqla: migrate a throwaway database to the head of its
# migrations and compare it with the models (alembic check). Any model change that no
# migration covers fails the run, naming the Base and the operations that are missing.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrations-check-${{ github.ref }}
  cancel-in-progress: true

env:
  # Space-separated module:attr list, e.g. "ukrdc_sqla.ukrdc:Base ukrdc_sqla.empi:Base".
  # Empty: every module in ukrdc_sqla with a declarative Base is found automatically.
  MODEL_BASES: ""
  DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install poetry
          poetry install --with dev --extras migration

      - name: Find the model Bases
        id: bases
        run: |
          if [ -n "$MODEL_BASES" ]; then
            bases="$MODEL_BASES"
          else
            bases=$(poetry run python - <<'EOF'
          import importlib
          import pkgutil
          import subprocess
          import sys

          from sqlalchemy import MetaData

          import ukrdc_sqla

          best = {}  # one module per Base: the one defining the most of its models
          for info in pkgutil.walk_packages(ukrdc_sqla.__path__, "ukrdc_sqla."):
              try:
                  module = importlib.import_module(info.name)
              except Exception as e:
                  print(f"skipping {info.name}: {e}", file=sys.stderr)
                  continue
              base = getattr(module, "Base", None)
              metadata = base if isinstance(base, MetaData) else getattr(base, "metadata", None)
              if not isinstance(metadata, MetaData):
                  continue
              mappers = getattr(getattr(base, "registry", None), "mappers", [])
              own = sum(m.class_.__module__ == info.name for m in mappers)
              if id(metadata) not in best or own > best[id(metadata)][1]:
                  best[id(metadata)] = (info.name, own, metadata)

          for name, _, metadata in best.values():
              if not metadata.tables:
                  continue
              # imported on its own, the module must load every table of its Base, or the
              # check would report the tables it misses as removed
              code = (f"import {name} as m; b = m.Base; "
                      "print(len(getattr(b, 'metadata', b).tables))")
              alone = int(subprocess.run([sys.executable, "-c", code], capture_output=True,
                                         text=True, check=True).stdout)
              if alone != len(metadata.tables):
                  sys.exit(f"{name}:Base loads {alone} of its {len(metadata.tables)} tables on "
                           "its own: import the missing models from that module.")
              print(f"{name}:Base")
          EOF
            )
          fi
          echo "Model Bases: $bases"
          echo "list=$(echo $bases)" >> "$GITHUB_OUTPUT"

      - name: Check the migrations match the models
        env:
          BASES: ${{ steps.bases.outputs.list }}
        run: |
          set -uo pipefail
          failed=()
          {
            echo "## Migrations check"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          for base in $BASES; do
            echo "::group::$base"
            if out=$(poetry run python migration_tool/migrate.py check \
                       --models "$base" --db-url "$DB_URL" 2>&1); then
              echo "$out"
              echo "- \`$base\`: up to date" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$out"
              failed+=("$base")
              echo "::error title=Migrations out of date::$base has model changes that no migration covers. Generate one with: python migration_tool/migrate.py revision --autogenerate -m \"<message>\" --models $base"
              {
                echo "- \`$base\`: **model changes not in a migration**"
                echo
                echo '  ```'
                echo "$out" | sed 's/^/  /'
                echo '  ```'
                echo
                echo "  Generate the migration and commit it:"
                echo
                echo '  ```'
                echo "  python migration_tool/migrate.py revision --autogenerate -m \"<message>\" --models $base"
                echo "  python migration_tool/csv_migrate.py generate -m \"<message>\" --models $base"
                echo '  ```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done

          if [ ${#failed[@]} -ne 0 ]; then
            echo "Migrations out of date for: ${failed[*]}"
            exit 1
          fi
          echo "All migrations match the models."