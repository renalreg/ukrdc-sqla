# Alembic settings for the migrations in this folder (copied here by migrate.py).
# Apply them with:  alembic -c <this file> upgrade head
# sqlalchemy.url is the database to apply them to (DATABASE_URL overrides it), e.g.
# postgresql+psycopg://user:pw@host:5432/ukrdc (or postgresql+psycopg2://...).
# Write a % in the password as %%.

[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
