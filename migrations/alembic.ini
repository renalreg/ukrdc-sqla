# Alembic settings for every database's migrations. env.py and script.py.mako in this folder
# are shared; each database has a section below and its revisions in <name>/versions.
#
# Pick the database with -n and give the URL in DATABASE_URL:
#
#     DATABASE_URL=postgresql+psycopg://user:pw@host:5432/ukrdc \
#         alembic -c migrations/alembic.ini -n ukrdc upgrade head
#
# Options a section can set besides version_locations:
#   prepend_sys_path    folder revisions import helpers from (ukrdc: views.py, triggers.py)
#   views_and_triggers  true: new revisions rebuild views and triggers (script.py.mako)
#   lock_timeout        SET LOCAL lock_timeout for the migration; -x lock_timeout=... or
#                       LOCK_TIMEOUT overrides it
#
# migrate.py adds a section, and its versions folder, the first time it makes a revision
# for a new database.

[DEFAULT]
script_location = %(here)s
path_separator = os
sqlalchemy.url =

[audit]
version_locations = %(here)s/audit/versions

[empi]
version_locations = %(here)s/empi/versions

[errorsdb]
version_locations = %(here)s/errorsdb/versions

[stats]
version_locations = %(here)s/stats/versions

[ukrdc]
version_locations = %(here)s/ukrdc/versions
prepend_sys_path = %(here)s/ukrdc
views_and_triggers = true
lock_timeout = 10s

[xmlarchive]
version_locations = %(here)s/xmlarchive/versions

# Logging

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
