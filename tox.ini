[tox]
envlist = py{310, 311, 312}-sqla20, ruff_format, ruff_lint, pyroma, deptry

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312, ruff_format, ruff_lint, pyroma, deptry

[testenv]
allowlist_externals = poetry
deps =
    sqla20: SQLAlchemy~=2.0
    pytest
commands =
    pytest tests/

[testenv:ruff_format]
description = 'Check code style with Ruff'
commands = poetry run ruff format . --check

[testenv:ruff_lint]
description = 'Execute static analysis with Ruff.'
commands = poetry run ruff check .

[testenv:pyroma]
description = Run pyroma to check packaging quality
deps =
    pyroma
commands =
    # Never fail GitHub Actions
    - pyroma .

[testenv:deptry]
description = 'Check for dependency issues'
commands = poetry run deptry .
