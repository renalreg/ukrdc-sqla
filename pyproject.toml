[tool.poetry]
authors = ["Joel Collins <joel.collins@renalregistry.nhs.uk>"]
description = "SQLAlchemy models for the UKRDC"
name = "ukrdc-sqla"
readme = "README.md"
version = "4.9.0"

[tool.poetry.dependencies]
SQLAlchemy = ">=2.0.0,<3.0.0"
python = ">=3.10.0,<4.0"
psycopg2 = "^2.9.13"
polars = "^1.44.2"

# Optional dependencies, installed only via the "migration" extra below
alembic = { version = "^1.20.0", optional = true }
click = { version = "^8.5.0", optional = true }
psycopg = { version = "^3.3.6", extras = ["binary"], optional = true }

[tool.poetry.extras]
migration = ["alembic", "click", "psycopg"]

[tool.poetry.group.dev.dependencies]
deptry = "^0.25.1"
pytest = ">=7.1.3,<10.0.0"
ruff = ">=0.4.2,<0.17.0"
tox = "^4.15.0"
tox-gh-actions = "<4.2.0"
mypy = "*"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0"]