[tool.poetry]
authors = ["Joel Collins <joel.collins@renalregistry.nhs.uk>"]
description = "SQLAlchemy models for the UKRDC"
name = "ukrdc-sqla"
readme = "README.md"
version = "4.7.0"

[tool.poetry.dependencies]
SQLAlchemy = ">=2.0.0,<3.0.0"
python = ">=3.10.0,<4.0"
psycopg2 = "^2.9.13"

[tool.poetry.group.dev.dependencies]
deptry = "^0.25.1"
pytest = ">=7.1.3,<10.0.0"
ruff = ">=0.4.2,<0.17.0"
tox = "^4.15.0"
tox-gh-actions = "<4.2.0"
mypy = "*"


[tool.poetry.group.migration]
optional = true
[tool.poetry.group.migration.dependencies]
alembic = "^1.20.0"
sqlglot = "^30.19.0"
click = "^8.5.0"
psycopg = {extras = ["binary"], version = "^3.3.6"}

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0"]
